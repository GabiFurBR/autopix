# Token do MercadoPago para consultar transacoes.
# Nunca publique este token em repositorios ou prints.
token-mp: 'SEU TOKEN DO MERCADO PAGO'

pix:
  chave: 'SUA CHAVE PIX'
  nome: 'Fulano de Tal'
  debug: false
  mapa: true

automatico:
  ativado: true
  intervalo: 10
  # Opcional: URL HTTPS para webhook de notificacao do Mercado Pago (deixe vazio se nao utilizar)
  notificacoes: ''

# Banco de dados: postgresql (Neon), mysql ou sqlite.
# Para Neon, use o HOST com "-pooler" fornecido pelo botao Connect.
# Nao coloque a URL completa com senha no repositorio publico.
database:
  type: postgresql
  host: 'SEU_HOST_NEON_POOLER'
  port: 5432
  db: 'SEU_BANCO'
  user: 'SEU_USUARIO'
  pass: 'SUA_SENHA'
  sslmode: require
  channel-binding: require
  use-ssl: false
  pool:
    maximum-size: 3
    minimum-idle: 0
    connection-timeout: 10000
    idle-timeout: 60000
    max-lifetime: 300000

tempos:
  validar: 60
  lista: 30
  criar-pedido: 300
  holograma: 30
  cancelar: 30
  top: 30

mapa:
  nome: '&aQR code de pagamento'
  descricao:
  - '&7Data: &f{data}'
  - '&7Jogador: &f{jogador}'
  - '&7Produto: &f{produto}'
  tempo-pagar: 30
  intervalo: 60

menu:
  principal:
      titulo: '&9&lCompre produtos por &c&lPIX'
      tamanho: 54
      preencher-fundo: false
      produtos:
        VIP1:
          preco: 0.23
          pre-comandos:
          - 'say {player} gerou uma ordem PIX!'
          comandos:
          - 'say {player} pagou por PIX!'
          icone:
            slot: 5
            material: diamond_sword
            nome: '&6&lVIP 1 &7- &aR${preco}'
            descricao:
            - '&7Vip por &c30 &7dias'
            - '&7Clique para comprar por &aPIX'
      historico:
        slot: 50
        icone:
          material: clock
          nome: '&b&lMeus Pedidos PIX'
          descricao:
          - '&7Clique para visualizar seu'
          - '&7historico e status em tempo real.'
  confirmar:
    titulo: '&9&lConfirmar compra por &c&lPIX'
    tamanho: 27
    preencher-fundo: true
    resumo:
      slot: 5
    cancelar:
      slot: 19
      icone:
        material: RED_WOOL
        data: 14
        nome: '&cCancelar'
    confirmar:
      slot: 27
      icone:
        material: LIME_WOOL
        data: 5
        nome: '&aConfirmar'
        descricao:
        - '&7Gerar codigo &bQR &7para'
        - '&7pagar por PIX.'
    desconto:
      slot: 14
      icone:
        material: paper
        nome: '&bAplicar cupom'
        descricao:
        - '&7Clique para informar um cupom no chat'
  historico:
    titulo: '&9&lHistórico de Pedidos &b&lPIX'

cupons:
  desconto15:
    porcentagem: 15
    validade: 31/12/2023
    itens:
    - vip1

# Configuracao legada mantida por compatibilidade
som:
  ativar: true
  efeito: BLOCK_NOTE_BLOCK_BASS

# Configuracoes independentes de som (executados na thread principal)
sons:
  abrir-menu:
    ativar: true
    som: BLOCK_CHEST_OPEN
    volume: 0.7
    pitch: 1.1
  selecionar-produto:
    ativar: true
    som: UI_BUTTON_CLICK
    volume: 0.8
    pitch: 1.2
  confirmar-compra:
    ativar: true
    som: BLOCK_NOTE_BLOCK_PLING
    volume: 0.9
    pitch: 1.3
  gerar-qrcode:
    ativar: true
    som: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 1.0
    pitch: 1.2
  pagamento-aprovado:
    ativar: true
    som: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.0
  pagamento-rejeitado:
    ativar: true
    som: ENTITY_VILLAGER_NO
    volume: 1.0
    pitch: 0.9
  pagamento-cancelado:
    ativar: true
    som: BLOCK_NOTE_BLOCK_BASS
    volume: 0.9
    pitch: 0.8
  erro-conexao:
    ativar: true
    som: BLOCK_ANVIL_LAND
    volume: 0.6
    pitch: 0.8
  pedido-expirado:
    ativar: true
    som: BLOCK_NOTE_BLOCK_DIDGERIDOO
    volume: 0.9
    pitch: 0.8

# Notificacoes opcionais via Discord Webhook (independente de DiscordSRV/DiSky)
discord:
  webhook:
    ativado: false
    url: ''
    username: 'AutoPix'
    cor: 3066993
    titulo: 'Pagamento PIX Aprovado!'
    descricao: 'O jogador **{player}** adquiriu **{produto}** por **R$ {valor}** (Pedido `#{pedido}`).'

top-doadores: 5

info:
  titulo: '&aInfo PIX'
  autor: '&bAutoPix'
  paginas:
    1:
    - ' &2&nPagamentos por PIX&r'
    - ' '
    - '&8Para pagar com &cPIX &8 use o comando:'
    - ' '
    - '      &9/comprarpix'
    - ' '
    - '&8Um menu ira aparecer mostrando os produtos disponiveis.'
    2:
    - '&8Escolha o produto que deseja e ao confirmar sera gerado um &8codigo &4&lQR.'
    - ' '
    - '&8Com o app do seu banco scaneie e realize o pagamento.'
    3:
    - '&8Apos finalizar obtenha o ID da transacao.'
    - ' '
    - '&8Ele e mostrado no comprovante, tem &c32 &8caracteres e comeca com &8a letra &c&lE&8.'
    - ' '
    - '&8Exemplo:'
    - '&7E00416968202301162037NF2oRtQ73bY'
    4:
    - '&8Com o codigo em maos digite:'
    - ' '
    - ' &9/pix validar <Codigo>'
    - ' '
    - '&8Seu PIX sera validado'
    - '&8e voce recebera seu produto.'
